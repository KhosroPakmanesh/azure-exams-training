[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-103-training"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "azure-identity==1.27.0",
    "httpx==0.28.1",
    "openai==2.54.0",
    "python-dotenv==1.2.4",
]

[tool.setuptools]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py310"
